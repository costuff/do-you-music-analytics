version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: doyou-analytics-db
    environment:
      POSTGRES_DB: doyou_music
      POSTGRES_USER: doyou
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_password_change_me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doyou"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

