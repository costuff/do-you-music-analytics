version: '3.8'

services:
  # PostgreSQL Database (shared with scraper)
  postgres:
    image: postgres:16-alpine
    container_name: doyou-analytics-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-doyou_music}
      POSTGRES_USER: ${POSTGRES_USER:-doyou}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-doyou}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - doyou-network

  # Analytics Worker
  worker:
    image: ghcr.io/costuff/do-you-music-analytics-worker:latest
    container_name: doyou-analytics-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-doyou}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-doyou_music}
      
      # Storage
      NAS_MOUNT_PATH: /mnt/music/downloads
      VALIDATE_NAS_ON_STARTUP: ${VALIDATE_NAS_ON_STARTUP:-true}
      
      # Analysis Configuration
      BATCH_SIZE: ${BATCH_SIZE:-10}
      MAX_WORKERS: ${MAX_WORKERS:-6}
      PYTHON_PATH: /usr/local/bin/python3
      ANALYSIS_SCRIPT: /app/scripts/analyze_audio.py
      ANALYSIS_TIMEOUT: ${ANALYSIS_TIMEOUT:-300s}
      SCAN_INTERVAL: ${SCAN_INTERVAL:-30m}
      
      # Cleanup Configuration
      ENABLE_CLEANUP: ${ENABLE_CLEANUP:-true}
      CLEANUP_ACTION: ${CLEANUP_ACTION:-mark}
      CLEANUP_INTERVAL: ${CLEANUP_INTERVAL:-24h}
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # Mount NAS music directory (read-write)
      - ${NAS_MUSIC_PATH}:/mnt/music/downloads:rw
    networks:
      - doyou-network
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Analytics API (Phase 5)
  api:
    image: ghcr.io/costuff/do-you-music-analytics-api:latest
    container_name: doyou-analytics-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-doyou}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-doyou_music}
      
      # API Configuration
      PORT: ${API_PORT:-8080}
      
      # Disable worker-specific validations
      VALIDATE_PYTHON: "false"
      VALIDATE_NAS_ON_STARTUP: "false"
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      # Mount NAS music directory (read-only) for validation
      - ${NAS_MUSIC_PATH}:/mnt/music/downloads:ro
    networks:
      - doyou-network
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Watchtower - Auto-update containers on new images
  watchtower:
    image: containrrr/watchtower:latest
    container_name: doyou-watchtower
    restart: unless-stopped
    environment:
      WATCHTOWER_POLL_INTERVAL: 300  # Check every 5 minutes
      WATCHTOWER_CLEANUP: "true"     # Remove old images
      WATCHTOWER_INCLUDE_RESTARTING: "true"
      WATCHTOWER_LABEL_ENABLE: "true"  # Only update labeled containers
      WATCHTOWER_ROLLING_RESTART: "true"
      WATCHTOWER_NOTIFICATIONS: ${WATCHTOWER_NOTIFICATIONS:-}
      WATCHTOWER_NOTIFICATION_URL: ${WATCHTOWER_NOTIFICATION_URL:-}
      DOCKER_API_VERSION: "1.44"  # Force newer API version
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ~/.docker/config.json:/config.json:ro  # For authenticated pulls
    networks:
      - doyou-network

volumes:
  postgres_data:
    name: doyou_postgres_data

networks:
  doyou-network:
    name: doyou-network
    driver: bridge
