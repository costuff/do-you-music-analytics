services:
  # PostgreSQL Database (shared with scraper)
  postgres:
    image: postgres:16-alpine
    container_name: doyou-analytics-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-doyou_music}
      POSTGRES_USER: ${POSTGRES_USER:-doyou}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment environment}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-doyou}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - doyou-network

  # Analytics Worker
  worker:
    image: ghcr.io/costuff/do-you-music-analytics-worker:latest
    container_name: doyou-analytics-worker
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-doyou}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment environment}@postgres:5432/${POSTGRES_DB:-doyou_music}
      
      # Storage
      NAS_MOUNT_PATH: /mnt/music/downloads
      VALIDATE_NAS_ON_STARTUP: ${VALIDATE_NAS_ON_STARTUP:-true}
      SHALLOW_SCAN: "false"   # always scan all subdirectories of NAS_MOUNT_PATH recursively
      
      # Analysis Configuration
      BATCH_SIZE: ${BATCH_SIZE:-10}
      MAX_WORKERS: ${MAX_WORKERS:-2}
      PYTHON_PATH: /usr/local/bin/python3
      ANALYSIS_SCRIPT: /app/scripts/analyze_audio.py
      ANALYSIS_TIMEOUT: ${ANALYSIS_TIMEOUT:-300s}
      MAX_ANALYSIS_ATTEMPTS: ${MAX_ANALYSIS_ATTEMPTS:-5}
      RETRY_BASE_DELAY: ${RETRY_BASE_DELAY:-30s}
      ANALYSIS_LEASE_TIMEOUT: ${ANALYSIS_LEASE_TIMEOUT:-10m}
      SCAN_INTERVAL: ${SCAN_INTERVAL:-30m}
      
      # Python/OpenBLAS thread limiting (prevents RLIMIT_NPROC exhaustion on Mac Mini)
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      
      # Cleanup Configuration
      ENABLE_CLEANUP: ${ENABLE_CLEANUP:-true}
      CLEANUP_ACTION: ${CLEANUP_ACTION:-mark}
      CLEANUP_INTERVAL: ${CLEANUP_INTERVAL:-10m}
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # Audio analysis only reads the mounted music library.
      - ${NAS_MUSIC_PATH:-/mnt/music}:/mnt/music/downloads:ro
    networks:
      - doyou-network
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Analytics API (Phase 5)
  api:
    image: ghcr.io/costuff/do-you-music-analytics-api:latest
    container_name: doyou-analytics-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://${POSTGRES_USER:-doyou}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the deployment environment}@postgres:5432/${POSTGRES_DB:-doyou_music}
      
      # API Configuration
      PORT: ${API_PORT:-8080}
      
      # Disable worker-specific validations
      VALIDATE_PYTHON: "false"
      VALIDATE_NAS_ON_STARTUP: "false"
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    volumes:
      # Mount NAS music directory (read-only) for validation
      - ${NAS_MUSIC_PATH:-/mnt/music}:/mnt/music/downloads:ro
    networks:
      - doyou-network
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/health >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Note: auto-updates handled by the watchtower container in the doyou-world-scraper stack
  # (which monitors all containers on this machine)

volumes:
  postgres_data:
    name: doyou_postgres_data

networks:
  doyou-network:
    name: doyou-network
    driver: bridge
